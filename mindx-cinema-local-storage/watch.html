<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xem phim - MindX Cinema</title>
  <link rel="icon" href="assets/icon.png">
  <link rel="stylesheet" href="./styles/style.css">
</head>

<body>

  <nav class="navbar">
    <a href="index.html" class="logo">MindX Cinema</a>
    <form action="search.html" method="get" class="search-form">
      <input type="text" name="q" placeholder="Tìm phim...">
      <button type="submit">Tìm</button>
    </form>
    <div id="auth-area"></div>
  </nav>

  <div class="watch-container">
    <iframe id="trailer-frame" src="" allowfullscreen></iframe>

    <h1 id="title"></h1>
    <p id="description"></p>

    <h3>Bình luận</h3>
    <div id="comment-form-area">
      <form id="comment-form">
        <input type="text" id="comment-input" placeholder="Viết bình luận..." required>
        <button type="submit">Gửi</button>
      </form>
    </div>
    <div id="comment-list"></div>
  </div>

  <script src="scripts/config.js"></script>
  <script src="scripts/watch.js"></script>
</body>

</html>
